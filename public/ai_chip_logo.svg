<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient (Clean Soft Ambient) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0217" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Side Wall Gradient (High Contrast) -->
    <linearGradient id="sideWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="50%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Top Chip Cap Gradient (Deep Dark Metallic) -->
    <linearGradient id="topCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#1e0538"/>
      <stop offset="100%" stop-color="#090114"/>
    </linearGradient>
  </defs>

  <!-- Background radial ambient light -->
  <rect width="300" height="200" fill="none" />
  <ellipse cx="150" cy="100" rx="140" ry="90" fill="url(#bgGlow)"/>

  <!-- Razor Sharp Radiating Circuit Tracks (Zero Blur, Crisp High Contrast Lines) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer circuit paths -->
    <path d="M 10 100 H 90 L 115 80" stroke="#f43f5e" stroke-width="2.5" fill="none" />
    <path d="M 20 55 H 75 L 105 78" stroke="#ec4899" stroke-width="2" fill="none" />
    <path d="M 15 145 H 80 L 110 120" stroke="#d946ef" stroke-width="2" fill="none" />
    
    <path d="M 290 100 H 210 L 185 120" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <path d="M 280 145 H 225 L 195 122" stroke="#06b6d4" stroke-width="2" fill="none" />
    <path d="M 285 55 H 220 L 190 80" stroke="#818cf8" stroke-width="2" fill="none" />

    <!-- Terminal Circuit Nodes -->
    <circle cx="10" cy="100" r="4.5" fill="#f43f5e" stroke="#ffffff" stroke-width="1"/>
    <circle cx="290" cy="100" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <circle cx="20" cy="55" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="280" cy="145" r="3.5" fill="#06b6d4" stroke="#ffffff" stroke-width="0.8"/>
  </g>

  <!-- 3D Isometric AI Processor Base & Pins (Razor Sharp Sharp Edges) -->
  <g transform="translate(150, 95)">

    <!-- Pins / Contacts extending out from 4 sides (Solid Crisp Neon Pins) -->
    <g fill="#ec4899" stroke="#ffffff" stroke-width="0.5">
      <!-- Left-bottom side pins -->
      <path d="M -45 10 l -9 4.5 l 2.5 2.5 l 9 -4.5 z" />
      <path d="M -33 17 l -9 4.5 l 2.5 2.5 l 9 -4.5 z" />
      <path d="M -21 24 l -9 4.5 l 2.5 2.5 l 9 -4.5 z" />
      <path d="M -9 31 l -9 4.5 l 2.5 2.5 l 9 -4.5 z" />
      <!-- Right-bottom side pins -->
      <path d="M 45 10 l 9 4.5 l -2.5 2.5 l -9 -4.5 z" fill="#38bdf8" />
      <path d="M 33 17 l 9 4.5 l -2.5 2.5 l -9 -4.5 z" fill="#38bdf8" />
      <path d="M 21 24 l 9 4.5 l -2.5 2.5 l -9 -4.5 z" fill="#38bdf8" />
      <path d="M 9 31 l 9 4.5 l -2.5 2.5 l -9 -4.5 z" fill="#38bdf8" />
      <!-- Left-top side pins -->
      <path d="M -45 -10 l -9 -4.5 l 2.5 -2.5 l 9 4.5 z" />
      <path d="M -33 -17 l -9 -4.5 l 2.5 -2.5 l 9 4.5 z" />
      <path d="M -21 -24 l -9 -4.5 l 2.5 -2.5 l 9 4.5 z" />
      <!-- Right-top side pins -->
      <path d="M 45 -10 l 9 -4.5 l -2.5 -2.5 l -9 4.5 z" fill="#38bdf8" />
      <path d="M 33 -17 l 9 -4.5 l -2.5 -2.5 l -9 4.5 z" fill="#38bdf8" />
      <path d="M 21 -24 l 9 -4.5 l -2.5 -2.5 l -9 4.5 z" fill="#38bdf8" />
    </g>

    <!-- 3D Thickness Side Walls (Lower extrusion) -->
    <polygon points="0,48 -58,18 -58,26 0,56 58,26 58,18" fill="url(#sideWallGrad)" stroke="#d946ef" stroke-width="1" />
    
    <!-- Outer Sharp Rim -->
    <polygon points="0,-36 -58,0 0,36 58,0" fill="#f43f5e" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Main Metallic Top Cap (Isometric Diamond) -->
    <polygon points="0,-34 -55,0 0,34 55,0" fill="url(#topCapGrad)" stroke="#ec4899" stroke-width="3.5" />
    
    <!-- Inner Etched Bezel Line -->
    <polygon points="0,-26 -43,0 0,26 43,0" fill="none" stroke="#38bdf8" stroke-width="2" />

    <!-- Ultra Sharp High Contrast Bold "AI" Text (Zero Blur) -->
    <text x="0" y="12" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="36" 
          font-style="italic" 
          font-weight="900" 
          fill="#ffffff" 
          stroke="#ec4899" 
          stroke-width="1.2"
          text-anchor="middle">
      AI
    </text>

  </g>
</svg>
