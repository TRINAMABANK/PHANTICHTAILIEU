<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070212" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Side Wall Gradient -->
    <linearGradient id="sideWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="50%" stop-color="#4a044e"/>
      <stop offset="100%" stop-color="#2a0230"/>
    </linearGradient>

    <!-- Top Chip Cap Gradient -->
    <linearGradient id="topCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c094d"/>
      <stop offset="50%" stop-color="#18042e"/>
      <stop offset="100%" stop-color="#0b0117"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Neon Glow -->
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background radial ambient light -->
  <rect width="300" height="200" fill="none" />
  <ellipse cx="150" cy="100" rx="130" ry="85" fill="url(#bgGlow)"/>

  <!-- Radiating Circuit Tracks -->
  <g stroke="#d946ef" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <!-- Left tracks -->
    <path d="M10 100 H90 L115 80" />
    <path d="M20 60 H75 L105 80" />
    <path d="M15 140 H80 L110 115" />
    <!-- Right tracks -->
    <path d="M290 100 H210 L185 120" />
    <path d="M280 140 H225 L195 120" />
    <path d="M285 60 H220 L190 85" />
    <!-- Circuit dots -->
    <circle cx="10" cy="100" r="3" fill="#d946ef" filter="url(#neonGlow)"/>
    <circle cx="290" cy="100" r="3" fill="#d946ef" filter="url(#neonGlow)"/>
    <circle cx="20" cy="60" r="2.5" fill="#d946ef"/>
    <circle cx="280" cy="140" r="2.5" fill="#d946ef"/>
  </g>

  <!-- 3D Isometric AI Processor Base & Pins -->
  <g transform="translate(150, 95)">

    <!-- Pins / Contacts extending out from 4 sides -->
    <g fill="#d946ef" opacity="0.85" filter="url(#neonGlow)">
      <!-- Left-bottom side pins -->
      <path d="M -45 10 l -8 4 l 2 2 l 8 -4 z" />
      <path d="M -33 17 l -8 4 l 2 2 l 8 -4 z" />
      <path d="M -21 24 l -8 4 l 2 2 l 8 -4 z" />
      <path d="M -9 31 l -8 4 l 2 2 l 8 -4 z" />
      <!-- Right-bottom side pins -->
      <path d="M 45 10 l 8 4 l -2 2 l -8 -4 z" />
      <path d="M 33 17 l 8 4 l -2 2 l -8 -4 z" />
      <path d="M 21 24 l 8 4 l -2 2 l -8 -4 z" />
      <path d="M 9 31 l 8 4 l -2 2 l -8 -4 z" />
      <!-- Left-top side pins -->
      <path d="M -45 -10 l -8 -4 l 2 -2 l 8 4 z" />
      <path d="M -33 -17 l -8 -4 l 2 -2 l 8 4 z" />
      <path d="M -21 -24 l -8 -4 l 2 -2 l 8 4 z" />
      <!-- Right-top side pins -->
      <path d="M 45 -10 l 8 -4 l -2 -2 l -8 4 z" />
      <path d="M 33 -17 l 8 -4 l -2 -2 l -8 4 z" />
      <path d="M 21 -24 l 8 -4 l -2 -2 l -8 4 z" />
    </g>

    <!-- 3D Thickness Side Walls (Lower extrusion) -->
    <polygon points="0,48 -58,18 -58,26 0,56 58,26 58,18" fill="url(#sideWallGrad)" />
    
    <!-- Outer Neon Glowing Border Rim -->
    <polygon points="0,-36 -58,0 0,36 58,0" fill="#ec4899" opacity="0.6" filter="url(#neonGlow)"/>

    <!-- Main Metallic Top Cap (Isometric Diamond) -->
    <polygon points="0,-34 -55,0 0,34 55,0" fill="url(#topCapGrad)" stroke="#d946ef" stroke-width="2.5" />
    
    <!-- Inner Etched Bezel Line -->
    <polygon points="0,-27 -44,0 0,27 44,0" fill="none" stroke="#ec4899" stroke-width="1.2" opacity="0.7" />

    <!-- Stylized Neon "AI" Text Logo -->
    <text x="0" y="10" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="34" 
          font-style="italic" 
          font-weight="900" 
          fill="#ffffff" 
          text-anchor="middle" 
          filter="url(#textGlow)">
      AI
    </text>

  </g>
</svg>
